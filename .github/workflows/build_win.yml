name: Build

on:
    pull_request:
        types:
            - opened
            - synchronize
    workflow_dispatch:
    push:
        branches:
            - develop
            - master

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Build (Windows x64)
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - name: Set timezone to JST
              run: tzutil /s "Tokyo Standard Time"

            - name: Check timezone
              shell: pwsh
              run: |
                tzutil /g
                Get-Date
                [TimeZoneInfo]::Local.Id

            - name: Checkout
              uses: actions/checkout@v7
              with:
                persist-credentials: false

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                global-json-file: global.json

            - name: Install dependencies
              run: dotnet restore

            - name: Build
              run: dotnet publish ConsolePlayground/ConsolePlayground.csproj -r win-x64 -p:PublishProfile=FolderProfile -c Release

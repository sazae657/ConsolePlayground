name: Build (Linux)

on:
    pull_request:
        types:
            - opened
            - synchronize
    workflow_dispatch:
    push:
        branches:
            - develop
            - master

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build (Linux x64)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Set timezone to JST
              run: sudo timedatectl set-timezone Asia/Tokyo

            - name: Check timezone
              run: |
                timedatectl show --property=Timezone --value
                date

            - name: Checkout
              uses: actions/checkout@v7
              with:
                persist-credentials: false

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                global-json-file: global.json

            - name: Install dependencies
              run: dotnet restore

            - name: Build
              run: dotnet publish ConsolePlayground/ConsolePlayground.csproj -r linux-x64 -p:PublishProfile=FolderProfile -c Release
